<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <button popovertarget="form-dialog">Add Book</button>
    <dialog id="form-dialog" popover>
        <form>
            <label for="new-book-title">Title</label>
            <input type="text" id="new-book-title">
            <label for="new-book-author">Author</label>
            <input type="text" id="new-book-author">
            <label for="new-book-pages">Pages</label>
            <input type="text" id="new-book-pages">
            <label for="new-book-status">Status</label>
            <input type="checkbox" id="new-book-status">
            <button id="add-book" type="submit">add book</button>
        </form>
        <button popovertarget="form-dialog" popovertargetaction="hide">Close</button>
    </dialog>
    <div class="container">
        <div class="book-card">
            <div>Title:</div>
            <div>Author:</div>
            <div>Pages:</div>
            <div>Read/Not Read</div>
        </div>
    </div>
</body>
</html>
